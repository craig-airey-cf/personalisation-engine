services:
  postgres:
    image: postgres:16-alpine
    container_name: personalisation-engine-postgres
    environment:
      POSTGRES_DB: personalisationengine
      POSTGRES_USER: persengine
      POSTGRES_PASSWORD: change-me
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persengine -d personalisationengine"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
